name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Release Binary
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Build release binary
        run: cargo build --release --verbose
      
      - name: Create tarball
        run: |
          cd target/release
          tar -czf kirei-${{ github.ref_name }}-macos-x86_64.tar.gz kirei
      
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: kirei-macos
          path: target/release/kirei-${{ github.ref_name }}-macos-x86_64.tar.gz

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: kirei-macos
          path: ./artifacts
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/kirei-${{ github.ref_name }}-macos-x86_64.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
